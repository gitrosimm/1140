name: Sync Upstream Repo

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）自动同步
    - cron: '0 0 * * *'
  # 必须保留：这是 Actions 页面出现 “Run workflow” 按钮的前提
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: nullmoth/nvidia-macos-driver
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Sync failure notice
        if: failure()
        run: |
          echo "::error::同步失败。最常见的原因：上游仓库修改了 .github/workflows/ 下的文件，导致 GitHub 暂停了本定时同步。"
          echo "::error::请前往你仓库主页，手动点击一次 'Sync fork'，然后再运行本工作流。"
          exit 1
